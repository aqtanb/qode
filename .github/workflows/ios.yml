name: CI - iOS Build

on:
  push:
    branches: [dev, main, 'release/**']
    paths: ['iosApp/**', 'shared/**', 'gradle/**', '*.gradle.kts', '.github/workflows/ios.yml']
  pull_request:
    branches: [dev, main]
    paths: ['iosApp/**', 'shared/**', 'gradle/**', '*.gradle.kts', '.github/workflows/ios.yml']

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # shared is also an Android library, so Gradle needs the SDK path even for the iOS framework.
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # The pre-build phase runs Gradle's embedAndSignAppleFrameworkForXcode, so this also builds shared.
      - name: Build for the simulator
        working-directory: iosApp
        run: |
          xcodebuild -project Qode.xcodeproj -scheme Qode \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
