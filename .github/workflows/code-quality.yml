name: Code Quality

on:
  push:
    branches: [dev, main, 'release/**']
    paths-ignore: ['web/**', '.github/workflows/web.yml']
  pull_request:
    branches: [dev, main]
    paths-ignore: ['web/**', '.github/workflows/web.yml']

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "WEB_CLIENT_ID=${{ secrets.FIREBASE_WEB_CLIENT_ID }}" >> local.properties

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run Spotless Check
        run: ./gradlew spotlessCheck --stacktrace

      - name: Check Fully Qualified Names
        run: ./gradlew checkFullyQualifiedNames --stacktrace