name: Deals Fetch

# Reads new deal messages from Telegram (topic 24 of t.me/superpodeshevle) and leaves them in
# the private deals-inbox bucket of qode-prod. The "Qode deals import" Claude routine publishes
# them; the last step starts it. Cloud routines can't open Telegram's MTProto connections, so this step lives here.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

concurrency:
  group: deals-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://hirfattxysizfprsydyq.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_PROD_SECRET_KEY }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION: ${{ secrets.TG_SESSION }}
    defaults:
      run:
        working-directory: tools/deals
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch new messages
        run: python fetch.py --out work/messages.json

      - name: Upload to the deals inbox
        run: python inbox.py upload work/messages.json

      - name: Start the deals import routine
        env:
          ROUTINE_FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST "$ROUTINE_FIRE_URL" \
            -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
            -H "anthropic-version: 2026-10-21" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"Deals Fetch run $GITHUB_RUN_ID uploaded a new batch.\"}"
