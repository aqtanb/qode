# Changelog config for git-cliff. Generate with: git cliff v0.8.3.. --tag vX.Y.Z -o CHANGELOG.md
# Only conventional commits are listed; docs, dependency bumps and version bumps are left out.

[changelog]
header = """
# Changelog

What changed in each Qode release. Generated from conventional commits with [git-cliff](https://git-cliff.org); \
earlier versions are in the git tags.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^docs", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^build\\(deps\\)", skip = true },
  { message = "bump version", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^test", group = "<!-- 4 -->Tests" },
  { message = "^ci", group = "<!-- 5 -->CI" },
  { message = "^build", group = "<!-- 6 -->Build" },
  { message = "^chore", group = "<!-- 7 -->Chores" },
]
