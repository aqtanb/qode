name: Qode
options:
  bundleIdPrefix: com.qodein
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "10.1.0"
targets:
  Qode:
    type: application
    platform: iOS
    sources:
      - Qode
    dependencies:
      - package: GoogleSignIn
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Debug.xcconfig
    info:
      path: Qode/Info.plist
      properties:
        CFBundleDisplayName: Qode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ru, kk]
        UILaunchScreen: {}
        SupabaseURL: $(SUPABASE_URL)
        SupabaseKey: $(SUPABASE_KEY)
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_URL_SCHEME)]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, Shared]
        TARGETED_DEVICE_FAMILY: "1"
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          sh ./gradlew :shared:embedAndSignAppleFrameworkForXcode
